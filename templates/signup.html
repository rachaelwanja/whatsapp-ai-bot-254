<!DOCTYPE html>
<html>

<head>

    <title>Signup</title>

    <style>

        body {
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            color: #777;
            user-select: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #25D366;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Create Account</h1>

    <form method="POST">

        <input
            type="email"
            name="username"
            placeholder="Email"
            required
        >

        <br><br>

        <div class="password-container">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required
            >

            <span
                class="toggle-password"
                onclick="togglePassword()"
                id="eye"
            >
                👁️
            </span>

        </div>

        <br><br>

        <input
            type="text"
            name="business_name"
            placeholder="Business Name"
        >

        <br><br>

        <input
            type="text"
            name="business_phone"
            placeholder="Phone Number"
        >

        <br><br>

        <button type="submit">

            Create Account

        </button>

    </form>

</div>

<script>

function togglePassword() {

    const password = document.getElementById("password");
    const eye = document.getElementById("eye");

    if (password.type === "password") {

        password.type = "text";
        eye.textContent = "🙈";

    } else {

        password.type = "password";
        eye.textContent = "👁️";

    }

}

</script>

</body>

</html>
