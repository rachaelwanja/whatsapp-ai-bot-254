<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - FlowAI</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
        }

        .card {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 32px;

            border-radius: 12px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        .password-container {
            position: relative;
            margin-top: 12px;
        }

        .password-container input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;
            padding-right: 45px;

            margin-top: 0;

            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .toggle-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            font-size: 18px;
            color: #777;

            user-select: none;
        }

        button {
            width: 100%;

            padding: 12px;

            margin-top: 18px;

            border: none;
            border-radius: 8px;

            background: #25D366;

            color: white;

            cursor: pointer;
        }

    </style>

</head>

<body>

    <div class="card">

        <h1>Reset your password</h1>

        <p>
            Enter your new FlowAI password below.
        </p>

        <form method="POST">

            <!-- NEW PASSWORD -->

            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="New password"
                    required
                >

                <span
                    class="toggle-password"
                    onclick="togglePassword('password', 'eye1')"
                    id="eye1"
                >
                    👁️
                </span>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="password-container">

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                >

                <span
                    class="toggle-password"
                    onclick="togglePassword('confirm_password', 'eye2')"
                    id="eye2"
                >
                    👁️
                </span>

            </div>


            <button type="submit">
                Update password
            </button>

        </form>

    </div>


    <script>

        function togglePassword(inputId, eyeId) {

            const password =
                document.getElementById(inputId);

            const eye =
                document.getElementById(eyeId);


            if (password.type === "password") {

                password.type = "text";

                eye.textContent = "🙈";

            } else {

                password.type = "password";

                eye.textContent = "👁️";

            }

        }

    </script>

</body>

</html>
