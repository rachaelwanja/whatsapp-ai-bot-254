<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - FlowAI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 18px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 18px;
            text-align: center;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Forgot your password?</h1>

        <p>
            Enter the email address associated with your FlowAI account
            and we'll send you a password reset link.
        </p>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Your email address"
                required
            >

            <button type="submit">
                Send reset link
            </button>

        </form>

        <a
            href="/login"
            class="back"
        >
            Back to login
        </a>

    </div>

</body>
</html>
